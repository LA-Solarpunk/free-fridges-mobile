# Kotlin/Native release-framework linking against MapLibre Native needs a lot of heap;
# 2 GB OOMs on :composeApp:linkReleaseFrameworkIosArm64.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx6144M
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.native.ignoreDisabledTargets=true
kotlin.native.cocoapods.generate.wrapper=true
